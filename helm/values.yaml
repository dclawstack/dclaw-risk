# Default values = DEV / local cluster. Reproduces the live dclaw-core deployment.
# Plain `helm install dclaw-risk ./helm -n dclaw-core` brings the app up.
# For the cloud/GHCR deployment, override with: -f values-prod.yaml

nameOverride: ""

backend:
  enabled: true
  replicaCount: 1
  image:
    repository: docker.io/library/dclaw-risk-backend
    tag: local
    pullPolicy: Never
  containerPort: 18162
  service:
    type: ClusterIP
    port: 18162
  env: {}
  livenessProbe:
    path: /health/
    initialDelaySeconds: 15
    periodSeconds: 30
  readinessProbe:
    path: /health/
    initialDelaySeconds: 10
    periodSeconds: 10
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: docker.io/library/dclaw-risk-frontend
    tag: local
    pullPolicy: Never
  containerPort: 3092
  service:
    type: NodePort
    port: 3092
    nodePort: 30051
  env:
    PORT: "3092"
    BACKEND_URL: http://dclaw-risk-backend:18162
  readinessProbe:
    path: /
    initialDelaySeconds: 5
    periodSeconds: 10
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

secret:
  name: ""
  data:
    DATABASE_URL: postgresql+asyncpg://postgres:postgres@dclaw-shared-postgres:5432/dclaw_risk
    APP_ENV: production
    COMPLIANCE_MOCK_MODE: "true"
    DEV_AUTH_BYPASS: "true"

ingress:
  enabled: false
  className: nginx
  annotations: {}
  host: ""
  tls: []
